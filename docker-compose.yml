name: shortener

x-app-env: &app-env
  DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: click-events
  KAFKA_PARTITIONS: "3"
  SCRAMBLE_SECRET: ${SCRAMBLE_SECRET:-24301}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    volumes: [./migrations:/migrations:ro]
    command: ["-path", "/migrations", "-database", "postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable", "up"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ., dockerfile: deploy/Dockerfile}
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SEED_API_KEY: ${SEED_API_KEY:-dev-key-change-me}
      TRUST_PROXY: "true" # nginx overwrites X-Forwarded-For
    deploy: {replicas: 2}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped

  consumer:
    build: {context: ., dockerfile: deploy/Dockerfile}
    entrypoint: ["/consumer"]
    environment:
      <<: *app-env
      KAFKA_GROUP: click-consumer
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
