# Round-robins across all `api` replicas. Docker's embedded DNS (127.0.0.11)
# returns one A record per replica; the variable in proxy_pass forces nginx to
# re-resolve every few seconds so scaling `api` up/down needs no restart.
events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;
  server {
    listen 8080;
    location / {
      set $upstream http://api:8080;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      # Overwrite (not append) so clients cannot spoof their IP; the API runs
      # with TRUST_PROXY=true and trusts this header.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_next_upstream error timeout http_502;
    }
  }
}
