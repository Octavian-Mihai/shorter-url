include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  click-events {
    # Must exceed the consumer's flush interval + insert time, or in-flight
    # messages reappear while still being processed (harmless but wasteful).
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
  }
}
