global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Docker's DNS returns one A record per replica, so scaling `api` is picked up automatically.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
  - job_name: consumer
    dns_sd_configs:
      - names: [consumer]
        type: A
        port: 9100
        refresh_interval: 10s
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
