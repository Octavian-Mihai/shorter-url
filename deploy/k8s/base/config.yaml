apiVersion: v1
kind: ConfigMap
metadata:
  name: shortener-config
data:
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: click-events
  KAFKA_PARTITIONS: "3"
  BASE_URL: http://localhost:8081
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9100"
  TRUST_PROXY: "false"   # no trusted proxy in front of the pods in kind
  RATE_LIMIT_BURST: "10"
  RATE_LIMIT_PER_MINUTE: "60"
---
# DEV ONLY. In a real cluster these come from a secret manager
# (External Secrets / Sealed Secrets), never from git.
apiVersion: v1
kind: Secret
metadata:
  name: shortener-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: shortener
  DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
  SEED_API_KEY: dev-key-change-me
  SCRAMBLE_SECRET: "24301"
