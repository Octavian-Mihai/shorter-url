apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Block until the migration Job has created the schema.
        - name: wait-for-schema
          image: postgres:16-alpine
          command: [sh, -c, "until psql \"$DATABASE_URL\" -tAc 'select 1 from id_sequences' >/dev/null 2>&1; do echo waiting for schema; sleep 2; done"]
          envFrom: [{secretRef: {name: shortener-secrets}}]
      containers:
        - name: api
          image: shortener
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: shortener-config}
            - secretRef: {name: shortener-secrets}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            # Let the endpoint controller drop this pod from Service endpoints
            # before SIGTERM, so in-flight and new requests are not sent to a
            # draining pod. (Native sleep: the distroless image has no shell.)
            preStop: {sleep: {seconds: 5}}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
